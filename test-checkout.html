<!doctype html>
<html>
<body style="font-family: sans-serif; max-width: 640px; margin: 40px auto;">
    <h3>Gearnix payment test</h3>

    <label>Key ID<br><input id="key" size="50"></label><br><br>
    <label>Razorpay order ID<br><input id="orderId" size="50"></label><br><br>
    <label>Amount (paise)<br><input id="amount" size="20"></label><br><br>

    <button id="pay">Pay with Razorpay (test)</button>

    <h4>Response (copy these into Postman)</h4>
    <pre id="result"></pre>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        document.getElementById('pay').onclick = () => {
            const options = {
                key: document.getElementById('key').value.trim(),
                amount: Number(document.getElementById('amount').value),
                currency: 'INR',
                order_id: document.getElementById('orderId').value.trim(),
                name: 'Gearnix Test',
                handler: (response) => {
                    document.getElementById('result').textContent = JSON.stringify(response, null, 2);
                }
            };

            new Razorpay(options).open();
        };
    </script>
</body>
</html>
